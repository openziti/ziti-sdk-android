name: CI build

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.GITHUB_RUN_NUMBER }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Check
        run: ./gradlew check
        timeout-minutes: 10
      - name: test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ziti-android/build/test-results/*/*.xml

      - name: Build
        run: ./gradlew build assemble